<style>

  }
  .role { margin: 22px 0 0; color: var(--muted); font-size: .95rem; letter-spacing: .02em; }
  nav { margin-top: 26px; display: flex; gap: 28px; font-size: .95rem; }
  nav a { color: var(--ink); text-decoration: none; padding-bottom: 3px; border-bottom: 1px solid rgba(255,255,255,.25); transition: color .2s, border-color .2s; }
  nav a:hover, nav a:focus-visible { color: var(--teal); border-color: var(--teal); outline: none; }
  .icons { margin: 22px 0 0; padding: 0; list-style: none; display: flex; gap: 18px; }
  .icons a { color: var(--muted); display: block; line-height: 0; transition: color .2s; }
  .icons a:hover, .icons a:focus-visible { color: var(--teal); outline: none; }
  .icons svg { width: 19px; height: 19px; fill: currentColor; }
  .cap { position: fixed; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
  .cap.br { right: clamp(24px, 4vw, 48px); bottom: 28px; text-align: right; }

  /* intro: the network assembles first (see landing-top.js), then the text arrives */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .copy h1, .copy .role, .copy nav, .copy .icons { opacity: 0; animation: rise .9s ease forwards; }
  .copy h1 { animation-delay: .9s; } .copy .role { animation-delay: 1.2s; }
  .copy nav { animation-delay: 1.4s; } .copy .icons { animation-delay: 1.6s; }
  .cap.br { opacity: 0; animation: rise 1s ease 2.4s forwards; transition: opacity .6s ease; }
  .cap.br.gone { opacity: 0 !important; }
  @media (prefers-reduced-motion: reduce) {
    .copy h1, .copy .role, .copy nav, .copy .icons, .cap.br { animation: none; opacity: 1; }
  }
  @media (max-width: 800px) {
    .cap.br { display: none; }
    .copy { bottom: 32px; }
  }
