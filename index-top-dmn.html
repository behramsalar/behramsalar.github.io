<style>
  :root { --bg: #070d14; --ink: #eef3f7; --muted: #8196a8; --teal: #5fd0c3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; opacity: 1; transition: opacity .3s ease; }
  body.leaving { opacity: 0; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .copy {
    position: fixed; left: clamp(24px, 6vw, 88px); bottom: clamp(28px, 8vh, 80px);
    pointer-events: none; max-width: calc(100vw - 48px);
  }
  .copy > * { pointer-events: auto; }
  h1 {
    font-family: "Source Serif 4", Georgia, serif; font-weight: 400;
    font-size: clamp(2.8rem, 7.4vw, 7rem); line-height: .98; letter-spacing: -0.03em; margin: 0;
  }
  .role { margin: 22px 0 0; color: var(--muted); font-size: .95rem; letter-spacing: .02em; }
  nav { margin-top: 28px; display: flex; gap: 28px; font-size: .95rem; }
  nav a { color: var(--ink); text-decoration: none; padding-bottom: 3px; border-bottom: 1px solid rgba(255,255,255,.25); transition: color .2s, border-color .2s; }
  nav a:hover, nav a:focus-visible { color: var(--teal); border-color: var(--teal); outline: none; }
  .cap { position: fixed; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
  .cap.tl { top: 28px; left: clamp(24px, 6vw, 88px); }
  .cap.br { right: clamp(24px, 4vw, 48px); bottom: 28px; text-align: right; }
  @media (max-width: 800px) {
    .cap.br { display: none; }
    .copy { bottom: 32px; }
  }
</style>
</head>
